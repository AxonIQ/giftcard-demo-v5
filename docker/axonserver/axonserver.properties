# Axon Server configuration, mounted into the "axonserver" service of docker-compose.yml as
# /axonserver/config/axonserver.properties.
#
# The image ships its own /axonserver/axonserver.properties with the storage locations (./events, ./log,
# ./data) that match the compose volumes. This file is loaded on top of it, so only set what you want
# to change; everything else keeps the image defaults.
#
# Axon Server needs a restart to pick up changes: docker compose restart axonserver

# Axoniq Platform connection.
# The token is NOT stored here: docker-compose.yml passes it in as the axoniq_platform_authentication
# environment variable (sourced from the git-ignored .env file).

# Node name as shown in the Axon Server UI and in Axoniq Platform (defaults to the container hostname).
axoniq.axonserver.name=axonserver

# Cluster initialization. Without this, an uninitialized node starts empty and waits to be initialized from
# the UI or CLI. With autocluster, the node whose internal hostname matches "first" initializes itself on
# first start and creates the listed contexts; "dcb=true" makes them DCB (Dynamic Consistency Boundary)
# contexts, as used by Axon Framework 5. "axonserver" is the container hostname set in docker-compose.yml.
# This only runs on an uninitialized node: data already in the compose volumes is left untouched
# ("docker compose down -v" wipes it and gives you a fresh DCB default context).
axoniq.axonserver.autocluster.first=axonserver
axoniq.axonserver.autocluster.contexts=default
axoniq.axonserver.autocluster.dcb=true

# Access control. Disabled: the GiftCard app and Insights connect without a token.
# When enabling it, also set insights.axonserver.token in docker/insights/application.properties and
# axon.axonserver.token in the GiftCard app.
axoniq.axonserver.accesscontrol.enabled=false
# axoniq.axonserver.accesscontrol.token=<token-for-applications>
# axoniq.axonserver.accesscontrol.admin-token=<token-for-the-cli-and-ui>

# Development mode: adds a "reset event store" option to the UI. Handy for demos, never for production.
axoniq.axonserver.devmode.enabled=true

# Messaging limits. Max message size in bytes (default 4 MB).
# axoniq.axonserver.max-message-size=4194304

# Event store tuning. Segment sizes are in bytes (defaults: 256 MB for events, 256 MB for snapshots).
# axoniq.axonserver.event.segment-size=268435456
# axoniq.axonserver.snapshot.segment-size=268435456

# Logging. The image writes ./data/axonserver.log (10 MB x 10 files) in addition to the console.
# logging.level.io.axoniq.axonserver=DEBUG
