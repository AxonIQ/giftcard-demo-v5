# Axoniq Insights configuration, mounted into the "insights" service of docker-compose.yml.

# Axoniq Platform connection.
# The token is NOT stored here: docker-compose.yml passes it in as the INSIGHTS_PLATFORM_AUTHENTICATION
# environment variable (sourced from the git-ignored .env file), which overrides this property.
# insights.platform.authentication=<set via .env>

# Axon Server connection (comma-separated list of Axon Server nodes).
# "axonserver" resolves to the Axon Server service on the compose network; 8124 is its gRPC port.
insights.axonserver.routing-servers=axonserver:8124

# Axon Server access token. Not needed: the Axon Server in docker-compose.yml runs without access control.
# insights.axonserver.token=<your-axonserver-token>

# "admin" user password (change this!).
insights.authorization.default-password=admin
